<!-- Declare that this is a html page -->
<!DOCTYPE html>
<!-- Add the page language -->
<html lang="en">

    <head>
        <!-- Declare the character encoding so non ASCII characters are displayed correctly -->
        <meta charset="UTF-8">
        <!-- Tell the browser that the page should be opened for the entire device width, and not zoomed in or out initially -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Vocabulary Trainer</title>

        <!-- External stylesheet -->
        <link rel="stylesheet" href="style.css">

    </head>

    <body>
        <header>
            <h1>Vocabulary Trainer</h1>
            <p>Learn a few new words every day.</p>
        </header>

        <main>
            <!-- Show greeting when a user is new -->
            <section id="greeting-first">
                <form>
                    <p>Welcome to the vocabulary trainer.</p>
                    <label>What's your name?
                        <input id="user-name" type="text" />
                    </label>
                    <button type="submit" id="user-name-submit">Enter!</button>
                </form>
            </section>

            <!-- Show greeting when a user is returning -->
            <section id="greeting-returning">
                    <p id="msg-returning-user">Welcome back to the vocabulary trainer, XXX!</p>
            </section>

            <!-- Select the unit/lesson -->
            <!-- As I use JS to evaluate, I do not need a "name" attribute. -->  
            <section>
                <label for="unit-selector">You are currently learning unit</label>

                <select id="unit-selector">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                    <option value="13">13</option>
                </select>
            </section>

            <!-- Select the learning method -->
            <section>
                <fieldset class="mode-selection">
                    <legend>Exercise mode</legend>

                    <!-- Input is a void element, so I always need to put a label. -->  
                    <!-- The name attributes tells the browser which options belong
                      to the set that only one element can be selected from. -->   
                    <label class="radio-option">
                        <input type="radio" name="mode" id="multiple-choice" value="multiple-choice" />
                        Multiple choice
                    </label>
                    
                    <label class="radio-option">
                        <input type="radio" name="mode" id="fill-in-the-blank" value="fill-in-the-blank" />
                        Fill in the blank
                    </label>
                </fieldset>
            </section>
            
            <!-- Multiple Choice -->
            <section>
                <p>Deutscher Satz</p>
                <form id="m-answer-form">
                    <label class="radio-option">
                        <input type="radio" name="m-answer" id="m-answer-1" value="m-answer-1" />
                        Answer 1
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="m-answer" id="m-answer-2" value="m-answer-2" />
                        Answer 2
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="m-answer" id="m-answer-3" value="m-answer-3" />
                        Answer 3
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="m-answer" id="m-answer-4" value="m-answer-4" />
                        Answer 4
                    </label>
                    
                    
                </form>
                
            </section>
            
            <!-- Fill in the blank -->
            <section>
                <p>Deutscher Satz</p>

                
            </section>


        </main>

        <footer>
            <p>&copy; 2026 Vocabulary Trainer</p>
        </footer>

    </body>

</html>
