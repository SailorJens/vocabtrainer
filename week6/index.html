<!-- Declare that this is a html page -->
<!DOCTYPE html>
<!-- Add the page language -->
<html lang="en">
    <head>
        <!-- Declare the character encoding so non ASCII characters are displayed correctly -->
        <meta charset="UTF-8">
        <!-- Tell the browser that the page should be opened for the entire device width, and not zoomed in or out initially -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap css and js -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

        <!-- My own stylesheet -->
        <link rel="stylesheet" href="style.css">

        <title>Vocabulary Trainer</title>


    </head>

    <body>
        <div class="container mt-0 ">

            <header>
                <div id="header-content">
                    <h1>Vocabulary Trainer</h1>
                    <small>Learn a few new words every day.</small>  
                </div>
            </header>

            <section id="user-area">
                <!-- known OR new user -->
            </section>

            <section id="settings-area">
                <!-- unit selector + mode selector -->
            </section>

            <main id="exercise-area">
                <!-- multiple choice OR fill blank -->
            </main>

            <section id="feedback-area">
                ...
            </section>

            <div id="action-area">
                <!-- submit / next -->
            </div>

        </div>
         

    </body>
</html>
