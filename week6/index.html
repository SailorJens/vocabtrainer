<!-- Declare that this is a html page -->
<!DOCTYPE html>
<!-- Add the page language -->
<html lang="en">
    <head>
        <!-- Declare the character encoding so non ASCII characters are displayed correctly -->
        <meta charset="UTF-8">
        <!-- Tell the browser that the page should be opened for the entire device width, and not zoomed in or out initially -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap css and js -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <!-- load icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

        <!-- My own stylesheet -->
        <link rel="stylesheet" href="style.css?v4">

        <!-- jQuery from Google CDN so it can use cached versions -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

        <!-- My own script, deferred to only load once the HTML DOM is loaded -->
        <script src="script.js" defer></script>

        <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

        <title>Vocabulary Trainer</title>


    </head>

    <body>
        <div class="container mt-0 ">

            <header class="mb-4 p-3 text-light">
                <h1 class="fs-2 fw-bold m-0">Vocabulary Trainer</h1>
                <small>Learn a few new words every day.</small>  
            </header>

            <section id="user-area">
                <!-- known OR new user -->
                <div id="new-user">
                    <form id="new-user-form">
                        <p class="fw-semibold">Welcome to the vocabulary trainer!</p>
                        <label>What's your name?
                            <input id="user-name" type="text" required />
                        </label>
                    </form>
                </div>

                <div id="known-user">
                    <p class="fw-semibold" id="msg-returning-user">
                        Welcome back to the vocabulary trainer, XXX!
                    </p>
                </div>

            </section>

            <section id="settings-area">
                <!-- unit selector AND mode selector -->
                 <div id="unit-selector">

                    <label for="unit">
                        You are currently learning unit
                    </label>

                    <select id="unit">
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                 </div>

                 <div id="mode-selector">
                    <fieldset class="border rounded p-3 my-2">
                        <legend class="small fst-italic text-secondary">Select an exercise mode</legend>

                        <!-- Input is a void element, so I always need to put a label. -->  
                        <!-- The name attributes tells the browser which options belong
                        to the set that only one element can be selected from. -->   
                        <div class="d-flex gap-3 align-items-center">
                            <label class="form-check d-flex align-items-center gap-2">
                                <input class="form-check-input mt-0" type="radio" name="mode" value="multiple-choice" />
                                <span class="form-check-label">Multiple choice</span>
                            </label>
                            
                            <label class="form-check d-flex align-items-center gap-2">
                                <input class="form-check-input mt-0" type="radio" name="mode"  value="fill-in-the-blank" />
                                <span class="form-check-label">Fill in the blank</span>
                            </label>
                        </div>
                    </fieldset>
                 </div>

            </section>

            <main id="exercise-area" class="mt-4">

                <p id="instruction" class="fst-italic text-secondary" />

                <p id="source-text" class="learning-content" />

                <!-- multiple choice OR fill blank -->
                 <div id="multiple-choice" class="learning-content" >
                    <form>
                        <fieldset>
                            <div id="mc-answers"  class="d-flex flex-column gap-2  border rounded p-2" >
                                <!-- answers added by jQuery -->
                            </div>
                        </fieldset>
                    </form>
                 </div>

                 <div id="fill-blank" >
                    <form>
                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <p class="mb-0">
                                <span id="fb-before" class="learning-content">ich</span>
                                <input type="text" id="fb-answer" aria-label="Missing word" class="mx-2 learning-content">
                                <span id="fb-after" class="learning-content">gestern nach Hause gegangen. Und ich muss das auch ein bisschen länger machen.</span>
                                <!-- button to listen for the sentence to help the user. -->
                                <button type="button" id="fb-listen" class="btn btn-secondary btn-sm  ms-auto">🔊 Listen</button>
                            </p>
                        </div>
                    </form>

                 </div>
            </main>

            <section id="feedback-area" class="mt-4">

                <!-- feedback -->
                 <p id="feedback-message" />

            </section>

            <div id="action-area" class="d-flex justify-content-end">
                <!-- create new user / submit answer / next question: button used for all actions -->
                <!-- use display:flex and justify content to the end via bootstrap to move the button to the right-->
                <button id="action-button" class="btn btn-primary">
                    <!-- generic bootstrap button styling -->
                    Create User
                </button>
            </div>

        </div>
         

    </body>
</html>
